<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevVerse — Where Builders Become Legends</title>
    <meta
      name="description"
      content="DevVerse is the operating system for developers: explore projects, join hackathons, build your portfolio, and climb the leaderboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        try {
          var mA = document.cookie.match(/(?:^|;\s*)dv_accent=([^;]+)/);
          var acc = mA ? decodeURIComponent(mA[1]) : (localStorage.getItem('dv_settings_accent') || 'violet');
          var mT = document.cookie.match(/(?:^|;\s*)dv_theme=([^;]+)/);
          var th = mT ? decodeURIComponent(mT[1]) : (localStorage.getItem('dv_settings_theme') || 'dark');
          var mM = document.cookie.match(/(?:^|;\s*)dv_motion=([^;]+)/);
          var mo = mM ? decodeURIComponent(mM[1]) : (localStorage.getItem('dv_settings_motion') || 'on');
          var darkCols = {
            violet: ['#7c6fff', 'rgba(124, 111, 255, 0.16)'],
            cyan: ['#4fe3c1', 'rgba(79, 227, 193, 0.14)'],
            coral: ['#ff6b5b', 'rgba(255, 107, 91, 0.14)'],
            amber: ['#ffb86b', 'rgba(255, 184, 107, 0.14)'],
            legend: ['#f0c419', 'rgba(240, 196, 25, 0.16)']
          };
          var lightCols = {
            violet: ['#9c2b3c', 'rgba(156, 43, 60, 0.14)'],
            cyan: ['#b07a3e', 'rgba(176, 122, 62, 0.16)'],
            coral: ['#c1502e', 'rgba(193, 80, 46, 0.15)'],
            amber: ['#a6862a', 'rgba(166, 134, 42, 0.16)'],
            legend: ['#d48806', 'rgba(212, 136, 6, 0.16)']
          };
          var cols = th === 'light' ? lightCols : darkCols;
          var pair = cols[acc] || cols.violet;
          var root = document.documentElement;
          root.setAttribute('data-theme', th);
          root.setAttribute('data-accent', acc);
          root.setAttribute('data-motion', mo);
          root.style.setProperty('--accent', pair[0]);
          root.style.setProperty('--accent-soft', pair[1]);
          root.style.setProperty('--aurora-1', pair[0]);
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c6fff'/%3E%3Cstop offset='1' stop-color='%234fe3c1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='67' font-size='46' font-family='Arial' font-weight='800' text-anchor='middle' fill='%2307080c'%3EDV%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
