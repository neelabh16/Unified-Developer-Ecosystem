<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Projects — DevVerse</title>
<script>(function(){try{var mA=document.cookie.match(/(?:^|;\s*)dv_accent=([^;]+)/);var acc=mA?decodeURIComponent(mA[1]):(localStorage.getItem('dv_settings_accent')||'violet');var mT=document.cookie.match(/(?:^|;\s*)dv_theme=([^;]+)/);var th=mT?decodeURIComponent(mT[1]):(localStorage.getItem('dv_settings_theme')||'dark');var mM=document.cookie.match(/(?:^|;\s*)dv_motion=([^;]+)/);var mo=mM?decodeURIComponent(mM[1]):(localStorage.getItem('dv_settings_motion')||'on');var darkCols={violet:'#7c6fff',cyan:'#4fe3c1',coral:'#ff6b5b',amber:'#ffb86b',legend:'#f0c419'};var lightCols={violet:'#9c2b3c',cyan:'#b07a3e',coral:'#c1502e',amber:'#a6862a',legend:'#d48806'};var cols=th==='light'?lightCols:darkCols;var c=cols[acc]||cols.violet;document.documentElement.setAttribute('data-theme',th);document.documentElement.setAttribute('data-accent',acc);document.documentElement.setAttribute('data-motion',mo);document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--aurora-1',c);}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c6fff'/%3E%3Cstop offset='1' stop-color='%234fe3c1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='67' font-size='46' font-family='Arial' font-weight='800' text-anchor='middle' fill='%2307080c'%3EDV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages/explore.css">
</head>
<body data-page="explore">

<div id="dv-chrome"></div>

<main>
  <section class="wrap page-header">
    <div class="eyebrow">The catalog</div>
    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;">
      <div>
        <h1 style="font-size:clamp(34px,5vw,54px);">Explore Projects</h1>
        <p class="lede">Search, filter, and sort through everything the DevVerse community is building.</p>
      </div>
      <a href="submit-project.html" class="btn btn-primary">+ Submit a project</a>
    </div>
  </section>

    <section class="wrap section-tight" style="padding-top:0;">
    <div class="glass" style="padding:20px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;">
      <div class="search-wrap" style="flex:1; min-width:240px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="explore-search" placeholder="Search projects, tags, or tech…">
        <kbd class="search-kbd">/</kbd>
      </div>
      <div class="pill-toggle" id="difficulty-toggle">
        <button data-difficulty="All" class="active">All</button>
        <button data-difficulty="Beginner">Beginner</button>
        <button data-difficulty="Intermediate">Intermediate</button>
        <button data-difficulty="Advanced">Advanced</button>
      </div>
      <select id="explore-sort" style="width:auto; min-width:180px;">
        <option value="trending">Sort: Trending</option>
        <option value="likes">Sort: Most liked</option>
        <option value="views">Sort: Most viewed</option>
        <option value="newest">Sort: Newest</option>
      </select>
    </div>
    <div id="category-filters" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;"></div>
  </section>

  <!-- My Projects Section (Below Search Bar & Filters) -->
  <section class="wrap section-tight" id="my-projects-section" style="padding-top:12px; display:none;">
    <div class="glass" style="padding:24px; margin-bottom:12px; border:1px solid var(--border-strong);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
        <div>
          <div class="eyebrow" style="margin-bottom:4px;">Your Submissions</div>
          <h2 style="font-size:22px; margin:0;">My Projects</h2>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <span class="mono muted" id="my-projects-count" style="font-size:12.5px;"></span>
          <a href="submit-project.html" class="btn btn-outline btn-sm">+ Submit Project</a>
        </div>
      </div>
      <div class="grid grid-3" id="my-projects-grid"></div>
    </div>
  </section>

  <section class="wrap section-tight">
    <div class="section-head" style="margin-bottom:22px;">
      <span class="mono muted" id="explore-count">0 projects</span>
    </div>
    <div class="grid grid-3" id="explore-grid"></div>
    <div id="explore-empty" style="display:none; text-align:center; padding:60px 0; color:var(--text-tertiary);">
      <p>No projects match those filters yet. Try a different search or category.</p>
    </div>
  </section>
</main>

<div id="dv-footer"></div>

<script src="js/data.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/app.js?v=2"></script>
<script src="js/pages/explore.js?v=2"></script>
</body>
</html>
